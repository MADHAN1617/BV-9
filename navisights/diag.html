<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BV-9 Error Diagnostic</title>
  <link rel="stylesheet" href="/assets/index-19b034b7.css">
  <style>
    #error-overlay {
      position: fixed; top: 0; left: 0; right: 0;
      background: #1a0000; color: #ff6b6b;
      font-family: monospace; font-size: 13px;
      padding: 16px; z-index: 99999;
      max-height: 50vh; overflow-y: auto;
      display: none;
      white-space: pre-wrap; word-break: break-all;
    }
    #error-overlay.visible { display: block; }
  </style>
</head>
<body>
  <div id="error-overlay"></div>
  <div id="root"></div>

  <script>
    const overlay = document.getElementById('error-overlay');
    function showError(msg) {
      overlay.classList.add('visible');
      overlay.textContent += msg + '\n\n';
    }

    window.onerror = function(msg, src, line, col, err) {
      showError('[JS ERROR] ' + msg + '\n  at ' + src + ':' + line + ':' + col + (err && err.stack ? '\n  Stack: ' + err.stack : ''));
    };
    window.addEventListener('unhandledrejection', function(e) {
      showError('[PROMISE ERROR] ' + (e.reason ? (e.reason.message || JSON.stringify(e.reason)) : 'unknown') + (e.reason && e.reason.stack ? '\n  Stack: ' + e.reason.stack : ''));
    });
    const origErr = console.error;
    console.error = function(...args) {
      showError('[CONSOLE.ERROR] ' + args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' '));
      origErr.apply(console, args);
    };
    const origWarn = console.warn;
    console.warn = function(...args) {
      showError('[CONSOLE.WARN] ' + args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' '));
      origWarn.apply(console, args);
    };
  </script>
  <script type="module" crossorigin src="/assets/index-86024637.js"></script>
</body>
</html>
