<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BV-9</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-86024637.js"></script>
    <link rel="stylesheet" href="/assets/index-19b034b7.css">
  </head>
  <body>
    <div id="root"></div>
    
  
    <style>
      @keyframes bv9-glow {
        0%, 100% { 
          text-shadow: 0 0 10px rgba(147, 51, 234, 0.6), 0 0 20px rgba(236, 72, 153, 0.4), 0 0 40px rgba(147, 51, 234, 0.2);
          filter: brightness(1.1);
        }
        50% { 
          text-shadow: 0 0 20px rgba(147, 51, 234, 0.8), 0 0 40px rgba(236, 72, 153, 0.6), 0 0 60px rgba(147, 51, 234, 0.3);
          filter: brightness(1.3);
        }
      }
      .bv9-logo {
        font-size: 3.5rem !important;
        font-weight: 900 !important;
        letter-spacing: 0.15em !important;
        background: linear-gradient(135deg, #9333ea, #ec4899, #ef4444, #f59e0b) !important;
        background-size: 300% 300% !important;
        -webkit-background-clip: text !important;
        background-clip: text !important;
        color: transparent !important;
        animation: bv9-glow 3s ease-in-out infinite, bv9-gradient-shift 4s ease infinite !important;
        -webkit-text-stroke: 0.5px rgba(147, 51, 234, 0.3);
      }
      @keyframes bv9-gradient-shift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      @media (min-width: 768px) {
        .bv9-logo { font-size: 4.5rem !important; }
      }
    </style>
    <script>
      setInterval(() => {
        // Make BV-9 logo text attractive safely
        document.querySelectorAll('span').forEach(span => {
          if (span.textContent.trim() === 'BV-9' && !span.classList.contains('bv9-logo')) {
            span.classList.add('bv9-logo');
          }
        });
      }, 500);
    </script>
  </body>

</html>
